[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xian-tech-linter"
version = "0.3.7-beta.1"
description = "Smart contract linter for the Xian blockchain"
readme = "README.md"
authors = [{ name = "Xian Network", email = "info@xian.org" }]
requires-python = ">=3.14,<3.15"
dependencies = [
    "pyflakes>=3.4,<4",
    "pydantic>=2,<3",
    "xian-tech-contracting>=1.0.8,<2",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.115.6,<1",
    "uvicorn>=0.34,<1",
]
vm = [
    "xian-tech-vm-core>=0.1.0,<0.2",
]

[project.scripts]
xian-linter = "xian_linter.server:run_server"

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "ruff>=0.15.12,<0.16",
]

[tool.uv.sources]
xian-tech-contracting = { path = "../xian-contracting", editable = true }
xian-tech-vm-core = { path = "../xian-contracting/packages/xian-vm-core", editable = true }

[tool.setuptools.packages.find]
where = ["."]
exclude = ["scripts*", "tests*"]

[tool.ruff]
line-length = 100
target-version = "py314"
exclude = ["contract.py", "contract.py.b64", "contract.py.gz"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
