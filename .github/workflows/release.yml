name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-context:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      version: ${{ steps.resolve.outputs.version }}
      xian_contracting_repository: ${{ steps.resolve.outputs.xian_contracting_repository }}
      xian_contracting_ref: ${{ steps.resolve.outputs.xian_contracting_ref }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Resolve immutable release context
        id: resolve
        env:
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.ref_name }}
          TRIGGER_SHA: ${{ github.sha }}
        run: python ./scripts/release_context.py resolve

  build:
    needs: release-context
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out immutable release source
        uses: actions/checkout@v7
        with:
          path: xian-linter
          ref: ${{ needs.release-context.outputs.source_sha }}

      - name: Check out pinned xian-contracting source
        uses: actions/checkout@v7
        with:
          repository: ${{ needs.release-context.outputs.xian_contracting_repository }}
          ref: ${{ needs.release-context.outputs.xian_contracting_ref }}
          path: xian-contracting

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install pinned uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.25"
          enable-cache: true
          cache-dependency-glob: xian-linter/uv.lock

      - name: Verify pinned source and package context
        working-directory: xian-linter
        env:
          COMPONENT_CHECKOUT: ${{ github.workspace }}/xian-contracting
          EXPECTED_SOURCE_SHA: ${{ needs.release-context.outputs.source_sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python ./scripts/release_context.py verify-component

      - name: Sync locked validation environment
        working-directory: xian-linter
        run: uv sync --frozen --group dev

      - name: Ruff lint
        working-directory: xian-linter
        run: uv run ruff check .

      - name: Ruff format check
        working-directory: xian-linter
        run: uv run ruff format --check .

      - name: Run tests
        working-directory: xian-linter
        run: uv run pytest -q

      - name: Build publishable distributions without local sources
        working-directory: xian-linter
        run: uv build --no-sources --out-dir dist

      - name: Verify release artifact metadata
        working-directory: xian-linter
        env:
          ARTIFACT_DIRECTORY: dist
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run python ./scripts/release_context.py verify-artifacts

      - name: Upload validated release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-dist
          path: xian-linter/dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs:
      - release-context
      - build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/xian-tech-linter
    steps:
      - name: Download validated release artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs:
      - release-context
      - build
      - publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated release artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.release-context.outputs.version }}
        run: |
          release_flags=()
          if [[ "${GITHUB_REF_NAME}" == *"-"* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "xian-tech-linter ${RELEASE_VERSION}" \
            --generate-notes \
            "${release_flags[@]}"
